name: Deploy Bot to Kerit Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Pull latest code on the Pterodactyl server via console command
      - name: Pull latest code on server
        run: |
          # Send 'git pull' command to the server console
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.PTERODACTYL_URL }}/api/client/servers/${{ secrets.PTERODACTYL_SERVER_ID }}/command" \
            -H "Authorization: Bearer ${{ secrets.PTERODACTYL_API_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"command": "Server is being updated via GitHub Actions..."}'
          echo ""
          echo "📦 Sent pull notification to server console."

      # Step 2: Restart the server to pick up changes
      - name: Restart server
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.PTERODACTYL_URL }}/api/client/servers/${{ secrets.PTERODACTYL_SERVER_ID }}/power" \
            -H "Authorization: Bearer ${{ secrets.PTERODACTYL_API_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"signal": "restart"}')

          if [ "$STATUS" -eq 204 ]; then
            echo "✅ Server restart signal sent successfully."
          else
            echo "❌ Failed to restart server. HTTP status: $STATUS"
            exit 1
          fi
